// Версия синтаксиса Protocol Buffers (proto3 - самая современная)
syntax = "proto3";

// Название пакета - помогает избежать конфликтов имен
// Аналог namespace в C# или package в Java
package user_service;

// ============================================================================
// ОПРЕДЕЛЕНИЕ МОДЕЛЕЙ ДАННЫХ (Data Transfer Objects - DTO)
// ============================================================================

// User - это структура данных для представления пользователя
// Каждое поле имеет:
// - тип (string, int64, etc)
// - название
// - уникальный номер (используется для сериализации, НЕ МЕНЯТЬ после релиза!)
message User {
  string id = 1;           // Уникальный идентификатор пользователя (UUID)
  string name = 2;         // Имя пользователя
  string email = 3;        // Email адрес
  int64 created_at = 4;    // Timestamp создания (Unix timestamp в секундах)
}

// ============================================================================
// REQUEST/RESPONSE ОБЪЕКТЫ ДЛЯ RPC МЕТОДОВ
// ============================================================================

// CreateUserRequest - данные для создания нового пользователя
// В gRPC каждый метод принимает ОДИН объект запроса и возвращает ОДИН объект ответа
message CreateUserRequest {
  string name = 1;   // Имя создаваемого пользователя (обязательное поле)
  string email = 2;  // Email создаваемого пользователя (обязательное поле)
}

// CreateUserResponse - ответ после создания пользователя
message CreateUserResponse {
  User user = 1;       // Созданный пользователь со всеми полями (включая id и created_at)
  string message = 2;  // Сообщение об успешном создании (например, "User created successfully")
}

// GetUserRequest - запрос для получения пользователя по ID
message GetUserRequest {
  string id = 1;  // ID пользователя, которого хотим получить
}

// GetUserResponse - ответ с данными пользователя
message GetUserResponse {
  User user = 1;  // Найденный пользователь (или пустой, если не найден)
}

// ListUsersRequest - запрос для получения списка пользователей с пагинацией
message ListUsersRequest {
  int32 page = 1;       // Номер страницы (начинается с 1)
  int32 page_size = 2;  // Количество пользователей на странице (например, 10, 20, 50)
}

// ListUsersResponse - ответ со списком пользователей
message ListUsersResponse {
  repeated User users = 1;  // "repeated" = массив/список пользователей
  int32 total = 2;          // Общее количество пользователей в базе (для расчета страниц)
}

// ============================================================================
// ОПРЕДЕЛЕНИЕ СЕРВИСА (API)
// ============================================================================

// UserService - это наш gRPC сервис (аналог REST API контроллера)
// Определяет какие методы (RPC - Remote Procedure Call) доступны клиентам
service UserService {
  // rpc - это метод, который можно вызвать удаленно
  // Формат: rpc ИмяМетода(ТипЗапроса) returns (ТипОтвета);
  
  // Создать нового пользователя
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  
  // Получить пользователя по ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  
  // Получить список всех пользователей с пагинацией
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}